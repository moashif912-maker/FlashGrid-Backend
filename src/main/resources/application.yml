server:
  port: 8080

spring:
  application:
    name: flashgrid

  datasource:
    url: jdbc:postgresql://localhost:5432/flashgrid
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

logging:
  level:
    com.flashgrid: INFO